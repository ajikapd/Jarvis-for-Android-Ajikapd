<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shell</title>
  <link rel="stylesheet" href="../assets/jarvis-ui.css" />
</head>
<body>
  <div class="page">
    <p><a href="index.html">← Index</a></p>
    <h1>Dashboard shell</h1>
    <p class="lead">Layout: <code>activity_dashboard_shell.xml</code> · Host: <code>DashboardActivity</code></p>
    <div class="phone">
      <div class="shell-top">JARVIS · LOCAL <span class="logo"></span></div>
      <div class="shell-body pad">
        <p class="muted">Контент вкладки inflates сюда (`screenContainer`).</p>
        <div class="note">Bottom nav строится кодом: ГЛАВНАЯ / LIVE / ПАМЯТЬ / КОМАНДЫ / ЕЩЁ</div>
      </div>
      <div class="shell-nav">
        <button class="active">ГЛАВНАЯ</button>
        <button>LIVE</button>
        <button>ПАМЯТЬ</button>
        <button>КОМАНДЫ</button>
        <button>ЕЩЁ</button>
      </div>
    </div>
    <p class="meta">Статус: <span class="badge ok">WORKING</span></p>
  </div>
</body>
</html>
