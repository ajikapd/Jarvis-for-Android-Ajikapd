<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Console</title>
  <link rel="stylesheet" href="../assets/jarvis-ui.css" />
  <style>
    .phone { background: #121212; }
    .blue { color: #1976D2; }
  </style>
</head>
<body>
  <div class="page">
    <p><a href="index.html">← Index</a></p>
    <h1>Test Console</h1>
    <p class="lead"><code>activity_test_console.xml</code> · debug · <span class="badge ok">WORKING</span></p>
    <div class="phone">
      <div class="shell-body pad" style="padding-top:24px">
        <div class="blue" style="font-size:24px;font-weight:700">TEST CONSOLE</div>
        <p class="muted" style="font-size:13px">Text pipeline + Voice wake word ("джарвис")</p>
        <div class="search" style="margin-top:24px;border-color:#1976D2">Например: включи фонарик</div>
        <div class="btn-gold" style="margin-top:12px;background:#1976D2;color:#fff">Send</div>
        <div class="section">Output</div>
        <div class="panel mono" style="font-size:12px;min-height:120px;color:#9E9E9E">response / logs…</div>
        <div class="section">Voice</div>
        <div class="panel muted" style="font-size:12px">Start / Stop voice · status line</div>
      </div>
    </div>
  </div>
</body>
</html>
